[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dinkster-token-verifier"
version = "0.1.1"
description = "Offline verification of Dinkster access tokens and policy snapshots"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28,<1",
    "joserfc>=1.7.5,<2",
    "packaging>=25,<27",
    "pydantic>=2.11,<3",
]

[project.optional-dependencies]
dev = [
    "build>=1.3,<2",
    "mypy>=1.17,<2",
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.1,<2",
    "ruff>=0.12,<1",
    "twine>=6.2,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dinkster_token_verifier = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
